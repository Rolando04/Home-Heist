services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homeheist
      POSTGRES_PASSWORD: homeheist
      POSTGRES_DB: homeheist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./agents/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
